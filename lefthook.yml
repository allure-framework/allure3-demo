pre-commit:
  jobs:
    - name: Format code
      glob:
        - "*.js"
        - "*.jsx"
        - "*.ts"
        - "*.tsx"
        - "*.mjs"
        - "*.cjs"
        - "*.mts"
        - "*.cts"
        - "*.json"
        - "*.jsonc"
        - "*.yml"
        - "*.yaml"
        - "*.md"
      run: yarn oxfmt --write {staged_files}
      exclude:
        - "allure-results/**"
        - "allure2-demo-test-results/**"
        - "test-results/**"
        - "node_modules/**"
        - "yarn.lock"
      stage_fixed: true
